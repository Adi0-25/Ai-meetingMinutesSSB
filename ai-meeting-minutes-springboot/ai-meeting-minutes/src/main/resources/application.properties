spring.application.name=ai-meeting-minutes
server.port=8080

# ---------------------------------------------------------------------------
# Database (H2, file-based -> persists in ./data so meeting history survives restarts)
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/meetingsdb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------------------------------------------------------------------------
# File upload limits (meeting audio can be sizeable)
# ---------------------------------------------------------------------------
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# ---------------------------------------------------------------------------
# OpenAI integration
# Set the OPENAI_API_KEY environment variable to enable real Whisper transcription
# and GPT-generated minutes. Without a key, transcription requires a key,
# but summarization gracefully falls back to a local, offline keyword summarizer.
# ---------------------------------------------------------------------------
openai.api-key=${OPENAI_API_KEY:}
openai.model.whisper=whisper-1
openai.model.chat=gpt-4o-mini

# ---------------------------------------------------------------------------
# API docs
# ---------------------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ---------------------------------------------------------------------------
# Actuator
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
